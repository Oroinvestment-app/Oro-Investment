<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORO Investment</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2);
            width: 80%;
            max-width: 350px;
            border: 1px solid #ffd700;
        }
        h1 {
            color: #ffd700;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #cccccc;
            font-size: 14px;
        }
        .btn {
            background-color: #ffd700;
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }
        .btn:hover {
            background-color: #e6c200;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>ORO Investment</h1>
        <p>Baga gara Telegram Mini App keenyaatti nagataan dhuftan!</p>
        <button class="btn" onclick="alert('Sirna Investment dhiyootti banama!')">Eegalchi</button>
    </div>

    <script>
        Telegram.WebApp.ready();
    </script>
</body>
</html>
